import com.diffplug.spotless.LineEnding

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.escalaelderly'
version = '0.0.1-SNAPSHOT'

// Prevent Google Drive Desktop (drivefs) file-lock contention on ephemeral Gradle build outputs
if (System.getenv('CI') == null && projectDir.absolutePath.contains('GoogleDrive')) {
    layout.buildDirectory.set(file("${System.getProperty('java.io.tmpdir')}/escala-elderly-build/${project.name}"))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

spotless {
    lineEndings = LineEnding.UNIX
    java {
        target 'src/**/*.java'
        encoding = 'UTF-8'
        googleJavaFormat('1.22.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
