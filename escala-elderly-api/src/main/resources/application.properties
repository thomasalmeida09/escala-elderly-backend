spring.application.name=escala-elderly-api
# Origens permitidas no CorsFilter em /api/** (em producao informe lista separada por virgulas, ex: http://localhost:5173,https://escala.example.com)
escala.cors.allowed-origins=*
# Parametros do canal em tempo real Server-Sent Events (GET /api/cuidadores/stream)
escala.sse.timeout-ms=1800000
escala.sse.max-subscribers=256
escala.sse.retry-ms=3000
escala.sse.heartbeat-ms=25000
